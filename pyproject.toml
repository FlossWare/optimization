[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization"
version = "0.1"
description = "Reusable genetic and evolutionary optimization algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Scot P. Floess", email = "sfloess@users.noreply.github.com" },
]
keywords = ["genetic-algorithm", "ai", "parameter-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/FlossWare/optimization"
Repository = "https://github.com/FlossWare/optimization"
Issues = "https://github.com/FlossWare/optimization/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy", "bandit"]

[tool.setuptools.packages.find]
include = ["optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]
